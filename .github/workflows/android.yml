name: Android preview
on:
  push:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/android.yml'
      - 'scripts/verify-android-apks.sh'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/android.yml'
      - 'scripts/verify-android-apks.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
      - run: flutter build apk --debug --split-per-abi
      - run: bash ../../scripts/verify-android-apks.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bcommend-android-preview
          path: apps/mobile/build/app/outputs/flutter-apk/*-debug.apk
          if-no-files-found: error
          retention-days: 7
